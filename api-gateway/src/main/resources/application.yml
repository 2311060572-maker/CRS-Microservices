server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # 1. Auth Service (cổng 8081)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # 2. Course Service - Partner (cổng 8082)
        - id: course-service-partner
          uri: http://localhost:8082
          predicates:
            - Path=/api/public/courses/**, /api/public/courses
          filters:
            - SetPath=/courses

        # 3. Course Service (cổng 8082)
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/courses/**, /api/courses
          filters:
            - StripPrefix=1

        # 4. Registration Service (cổng 8083)
        - id: registration-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/registrations/**, /api/registrations
          filters:
            - StripPrefix=1

jwt:
  secret: CRS-Microservices-Secret-Key-Nam-3-Hoc-Ky-2026-Doi-Trong-Thuc-Te

partner:
  api-key: crs-partner-key-2026